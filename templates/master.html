{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    {% block extra_links %} {% endblock  %}
<!--  4mb  -->
    <title> {% block title %} {% endblock %} </title>
</head>
<body>
<!--jinja templating language tags -->
<!-- python manage.py runserver-->
<nav class="navbar navbar-expand-sm border-bottom">
    <div class="container">
        <a class="navbar-brand" href="#">ABC Services</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="collapsibleNavbar">
            <ul class="navbar-nav ms-auto">
                {% url 'home' as home_url %}
                <li class="nav-item">
                    <a class="nav-link {% if request.path == home_url %} active {% endif %}" href="{% url 'home' %}">Home</a>
                </li>
                {% url 'about' as about_url %}
                <li class="nav-item">
                    <a class="nav-link {% if request.path == about_url %} active {% endif %}" href="{% url 'about' %}">About</a>
                </li>
                {% url 'products' as products_url %}
                <li class="nav-item">
                    <a class="nav-link {% if request.path == products_url %} active {% endif %}" href="{% url 'products' %}">Products</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

{% block content %}
{% endblock %}

<!--xampp -- troubleshoot --- wampp -- docker -- surebet -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
